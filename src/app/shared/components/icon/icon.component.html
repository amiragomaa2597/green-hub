<svg
  class="icon"
  [attr.width]="size"
  [attr.height]="size"
  viewBox="0 0 24 24"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
  aria-hidden="true"
>
  @switch (name) {
    @case ('leaf') {
      <path d="M5 19c8 0 12-6 12-14-5 0-11 3-12 14Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
      <path d="M7 17c3-3 6-7 7-12" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
    }
    @case ('sun') {
      <circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.7"/>
      <path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
    }
    @case ('solar') {
      <rect x="4" y="8" width="16" height="10" rx="1.5" stroke="currentColor" stroke-width="1.7"/>
      <path d="M12 8v10M4 13h16M8 4l4 4 4-4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    }
    @case ('cpu') {
      <rect x="6" y="6" width="12" height="12" rx="2" stroke="currentColor" stroke-width="1.7"/>
      <rect x="9" y="9" width="6" height="6" rx="1" stroke="currentColor" stroke-width="1.5"/>
      <path d="M9 2v2M15 2v2M9 20v2M15 20v2M2 9h2M2 15h2M20 9h2M20 15h2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
    }
    @case ('users') {
      <circle cx="9" cy="8" r="3" stroke="currentColor" stroke-width="1.7"/>
      <path d="M3.5 19c.7-3 2.8-4.5 5.5-4.5S13.8 16 14.5 19" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
      <circle cx="17" cy="9" r="2.3" stroke="currentColor" stroke-width="1.5"/>
      <path d="M16 14.5c2 .3 3.5 1.5 4 4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    }
    @case ('building') {
      <path d="M4 20h16M6 20V6l6-2 6 2v14M10 10h.01M14 10h.01M10 14h.01M14 14h.01M10 18h4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    }
    @case ('water') {
      <path d="M12 3s5 6.2 5 10a5 5 0 1 1-10 0c0-3.8 5-10 5-10Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
    }
    @case ('chart') {
      <path d="M4 19h16M7 16V9M12 16V5M17 16v-4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
    }
    @case ('shield') {
      <path d="M12 3 5 6v5c0 4.5 3 7.8 7 9 4-1.2 7-4.5 7-9V6l-7-3Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
      <path d="m9 12 2 2 4-4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    }
    @case ('target') {
      <circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="1.7"/>
      <circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.7"/>
      <circle cx="12" cy="12" r="1.2" fill="currentColor"/>
    }
    @case ('calendar') {
      <rect x="3.5" y="5" width="17" height="15" rx="2" stroke="currentColor" stroke-width="1.7"/>
      <path d="M8 3v4M16 3v4M3.5 10h17" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
    }
    @case ('coins') {
      <ellipse cx="10" cy="7" rx="5" ry="2.5" stroke="currentColor" stroke-width="1.6"/>
      <path d="M5 7v4c0 1.4 2.2 2.5 5 2.5s5-1.1 5-2.5V7" stroke="currentColor" stroke-width="1.6"/>
      <path d="M14 10.5c1.8.3 3 .9 3 1.8 0 1.4-2.2 2.5-5 2.5-.8 0-1.5-.1-2.2-.2" stroke="currentColor" stroke-width="1.6"/>
      <path d="M14 14.3c1.8.3 3 .9 3 1.8 0 1.4-2.2 2.5-5 2.5S7 17.5 7 16.1c0-.4.1-.7.3-1" stroke="currentColor" stroke-width="1.6"/>
    }
    @case ('check') {
      <circle cx="12" cy="12" r="8.5" stroke="currentColor" stroke-width="1.7"/>
      <path d="m8.5 12.2 2.3 2.3 4.7-5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    }
    @case ('x') {
      <circle cx="12" cy="12" r="8.5" stroke="currentColor" stroke-width="1.7"/>
      <path d="m9 9 6 6M15 9l-6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
    }
    @case ('grad') {
      <path d="m3 10 9-4 9 4-9 4-9-4Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
      <path d="M7 12.2v4.3C8.5 17.8 10.2 18.5 12 18.5s3.5-.7 5-1.999V12.2M21 10v6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
    }
    @case ('bolt') {
      <path d="M13 2 5 14h6l-1 8 8-12h-6l1-8Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
    }
    @case ('recycle') {
      <path d="M7 7.5 9.5 4H14l1.5 2.5M17 7.5l-1 5.5-4.5 2.5M7 16.5l4.5 2.5H16" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="m8.5 5.5-2 3.5M16.5 11l3 .2M12 18.5l-2.5-2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
    }
    @case ('handshake') {
      <path d="M8 12.5 10.5 10l2 2 2.5-2.5L18 12.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M4 14.5c2 2.5 4.5 3.5 8 3.5s6-1 8-3.5M7 8.5 4.5 11 7 13.5M17 8.5 19.5 11 17 13.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    }
    @case ('clock') {
      <circle cx="12" cy="12" r="8.5" stroke="currentColor" stroke-width="1.7"/>
      <path d="M12 7.5V12l3 2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    }
    @case ('award') {
      <circle cx="12" cy="9" r="5" stroke="currentColor" stroke-width="1.7"/>
      <path d="m9 13.5-1.5 7 4.5-2.5 4.5 2.5L15 13.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    }
    @case ('risk') {
      <path d="M12 4 3.5 19h17L12 4Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
      <path d="M12 10v4M12 16.5h.01" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
    }
    @case ('map') {
      <path d="M9 4.5 3.5 6.5v13L9 17.5l6 2 5.5-2v-13L15 6.5l-6-2Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
      <path d="M9 4.5v13M15 6.5v13" stroke="currentColor" stroke-width="1.7"/>
    }
    @case ('design') {
      <path d="M4 20 14.5 9.5a2.8 2.8 0 1 0-4-4L4 16v4h4Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
      <path d="M12.5 6.5 17.5 11.5M16 4l4 4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
    }
    @case ('person') {
      <circle cx="12" cy="8" r="3.2" stroke="currentColor" stroke-width="1.7"/>
      <path d="M5.5 19.5c1-3.8 3.4-5.5 6.5-5.5s5.5 1.7 6.5 5.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
    }
    @case ('bag') {
      <path d="M7 8h10l1 12H6L7 8Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
      <path d="M9 8V6.5a3 3 0 0 1 6 0V8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
    }
    @case ('download') {
      <path d="M12 4v10M8 10l4 4 4-4M5 19h14" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    }
    @case ('eye') {
      <path d="M2.5 12S6 6.5 12 6.5 21.5 12 21.5 12 18 17.5 12 17.5 2.5 12 2.5 12Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
      <circle cx="12" cy="12" r="2.8" stroke="currentColor" stroke-width="1.7"/>
    }
    @case ('file') {
      <path d="M8 3.5h6l4 4V20a1.5 1.5 0 0 1-1.5 1.5h-8.5A1.5 1.5 0 0 1 6.5 20V5A1.5 1.5 0 0 1 8 3.5Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
      <path d="M14 3.5V8h4.5M9 12h6M9 15.5h6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    }
  }
</svg>
