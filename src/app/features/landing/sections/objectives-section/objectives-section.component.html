<section id="objectives" class="section">
  <div class="container">
    <app-section-header
      [eyebrow]="content().eyebrow"
      [title]="content().title"
      [hook]="hook()"
      [lead]="content().intro"
    />

    <app-section-media
      [src]="visual().src"
      [alt]="visual().alt"
      [caption]="visual().caption"
    />

    <app-focus-rail
      [label]="content().eyebrow"
      [title]="content().title"
      [areas]="content().areas"
    />
  </div>
</section>
