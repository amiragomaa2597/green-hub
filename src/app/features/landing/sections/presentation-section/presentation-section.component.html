<section id="presentation" class="section section--alt">
  <div class="container">
    <app-section-header
      [eyebrow]="content().eyebrow"
      [title]="content().title"
      [hook]="hook()"
      [lead]="content().lead"
    />

    <article class="deck panel" appRevealOnScroll>
      <div class="deck__preview">
        <img [src]="visual().src" [alt]="visual().alt" class="deck__photo" />
        <img [src]="logo()" [alt]="content().project" class="deck__logo" />
        <div class="deck__badge">
          <app-icon name="file" [size]="18" />
          <span>{{ content().pages }}</span>
        </div>
      </div>

      <div class="deck__body">
        <h3>{{ content().project }}</h3>
        <p>{{ content().lead }}</p>
        <ul class="deck__meta">
          <li>
            <app-icon name="file" [size]="16" />
            {{ content().fileTypeDocx }}
          </li>
          <li>
            <app-icon name="file" [size]="16" />
            {{ content().fileTypePdf }}
          </li>
        </ul>

        <div class="deck__actions">
          <a
            class="btn btn--primary"
            [href]="content().filePathDocx"
            [download]="content().fileNameDocx"
          >
            <app-icon name="download" [size]="18" />
            {{ ui().downloadDocx }}
          </a>
          <a
            class="btn btn--secondary"
            [href]="content().filePathPdf"
            [download]="content().fileNamePdf"
          >
            <app-icon name="download" [size]="18" />
            {{ ui().downloadPdf }}
          </a>
        </div>
      </div>
    </article>
  </div>
</section>
