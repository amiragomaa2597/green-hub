<header class="nav" [class.nav--scrolled]="scrolled" [class.nav--menu-open]="menuOpen">
  <div class="container nav__inner">
    <a class="nav__brand" href="#hero" (click)="closeMenu()">
      <img [src]="meta().logo" [alt]="meta().brand + ' logo'" class="nav__logo" />
      <span>{{ meta().brand }}</span>
    </a>

    <div class="nav__actions">
      <button
        class="nav__lang"
        type="button"
        [attr.aria-label]="langToggleAria()"
        (click)="toggleLang()"
      >
        {{ nextLabel() }}
      </button>

      <button
        class="nav__toggle"
        type="button"
        [class.is-open]="menuOpen"
        [attr.aria-expanded]="menuOpen"
        [attr.aria-controls]="'nav-drawer'"
        [attr.aria-label]="ui().toggleNav"
        (click)="toggleMenu()"
      >
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>

    <nav class="nav__links nav__links--desktop" [attr.aria-label]="ui().primaryNav">
      @for (item of items(); track item.href) {
        <a [href]="item.href">{{ item.label }}</a>
      }
      <button
        class="nav__lang nav__lang--desktop"
        type="button"
        [attr.aria-label]="langToggleAria()"
        (click)="toggleLang()"
      >
        {{ nextLabel() }}
      </button>
    </nav>
  </div>
</header>

<div
  class="nav__backdrop"
  [class.is-open]="menuOpen"
  (click)="closeMenu()"
  aria-hidden="true"
></div>

<aside
  id="nav-drawer"
  class="nav__drawer"
  [class.is-open]="menuOpen"
  [attr.aria-hidden]="!menuOpen"
  [attr.aria-label]="ui().siteNav"
>
  <div class="nav__drawer-top">
    <a class="nav__drawer-brand" href="#hero" (click)="closeMenu()">
      <img [src]="meta().logo" alt="" class="nav__logo" />
      <div>
        <strong>{{ meta().brand }}</strong>
        <small>{{ meta().tagline }}</small>
      </div>
    </a>

    <button
      class="nav__drawer-close"
      type="button"
      [attr.aria-label]="ui().closeNav"
      (click)="closeMenu()"
    >
      <span></span>
      <span></span>
    </button>
  </div>

  <nav class="nav__drawer-nav" [attr.aria-label]="ui().mobileNav">
    @for (item of items(); track item.href; let i = $index) {
      <a
        class="nav__drawer-link"
        [href]="item.href"
        [style.--i]="i"
        (click)="closeMenu()"
      >
        <span class="nav__drawer-index">{{ padIndex(i + 1) }}</span>
        <span class="nav__drawer-label">{{ item.label }}</span>
        <span class="nav__drawer-arrow" aria-hidden="true">→</span>
      </a>
    }
  </nav>

  <div class="nav__drawer-foot">
    <button
      class="nav__lang nav__lang--drawer"
      type="button"
      [attr.aria-label]="langToggleAria()"
      (click)="toggleLang()"
    >
      {{ nextLabel() }}
    </button>
    <p>{{ meta().subtitle }}</p>
  </div>
</aside>
