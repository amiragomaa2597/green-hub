<section id="team" class="section team-stage section--alt">
  <div class="container">
    <div class="team-stage__head" appRevealOnScroll>
      <p class="speaker">
        <span class="speaker__dot" aria-hidden="true"></span>
        Presented by {{ content().speaker }}
      </p>
      <h2>{{ content().title }}</h2>
    </div>

    <article class="advisor" appRevealOnScroll>
      <span class="advisor__glow" aria-hidden="true"></span>
      <span class="advisor__badge">Instructor / Advisor</span>
      <h3>{{ content().advisor.name }}</h3>
      <p>{{ content().advisor.role }}</p>
    </article>

    <div class="roster">
      @for (member of content().members; track member.name; let i = $index) {
        <article
          class="roster__card"
          [style.--tone]="tones[i % tones.length]"
          [style.animation-delay]="0.06 * i + 's'"
          appRevealOnScroll
        >
          <span class="roster__index">{{ i + 1 }}</span>
          <span class="roster__icon">
            <app-icon [name]="iconOf(member.icon)" [size]="22" />
          </span>
          <h3>{{ member.name }}</h3>
          <p>{{ member.role }}</p>
        </article>
      }
    </div>
  </div>
</section>
