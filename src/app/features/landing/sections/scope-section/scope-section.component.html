<section id="scope" class="section">
  <div class="container">
    <app-section-header
      [eyebrow]="content().eyebrow"
      [title]="content().title"
      [hook]="hook()"
      [lead]="content().statement"
    />

    <app-scope-blueprint
      [blueprintLabel]="content().blueprintLabel"
      [blueprintTitle]="content().blueprintTitle"
      [phasesCaption]="content().phasesCaption"
      [description]="content().description"
      [statement]="content().statement"
      [missionBrief]="ui().missionBrief"
      [requirementsLabel]="ui().requirements"
      [requirements]="content().requirements"
      [includesLabel]="ui().includes"
      [excludesLabel]="ui().excludes"
      [includes]="content().includes"
      [excludes]="content().excludes"
      [assumptionsLabel]="ui().assumptions"
      [constraintsLabel]="ui().constraints"
      [assumptions]="content().assumptions"
      [constraints]="content().constraints"
      [strategyLabel]="ui().strategy"
      [phases]="content().phases"
      [acceptanceLabel]="ui().acceptanceCriteria"
      [acceptance]="content().acceptance"
      [costLabel]="ui().costBreakdown"
      [costNote]="content().costNote"
      [costItems]="content().costItems"
      [totalBudgetLabel]="content().totalBudgetLabel"
      [deliverablesLabel]="ui().deliverables"
      [deliverables]="content().deliverables"
      [modesLabel]="ui().scopeConsoleModes"
      [modeBoundary]="ui().scopeModeBoundary"
      [modeSystems]="ui().scopeModeSystems"
      [modeStrategy]="ui().scopeModeStrategy"
      [modeGates]="ui().scopeModeGates"
      [modeBudget]="ui().scopeModeBudget"
      [modeOutputs]="ui().scopeModeOutputs"
      [insideFence]="ui().insideFence"
      [outsideFence]="ui().outsideFence"
      [flipBoundary]="ui().flipBoundary"
      [lockStatus]="ui().lockStatus"
      [unlockedLabel]="ui().unlocked"
    />
  </div>
</section>
