<section id="hero" class="hero">
  <div class="hero__frame" aria-hidden="true">
    <div
      class="hero__media"
      [style.background-image]="'url(' + meta().heroImage + ')'"
    ></div>
    <div class="hero__veil"></div>
  </div>

  <div class="container hero__content hero-anim">
    <img class="hero__logo" [src]="meta().logo" [alt]="meta().brand + ' logo'" />
    <p class="hero__brand">{{ meta().brandCaps }}</p>
    <h1>{{ meta().subtitle }}</h1>
    <p class="hero__project">{{ meta().project }}</p>
    <p class="hero__program">
      {{ meta().program }} · Instructor: {{ meta().instructor }}
    </p>

    <div class="hero__cta">
      <a class="btn btn--primary" href="#about">{{ meta().exploreCta }}</a>
      <a class="btn btn--ghost" href="#scope">Scope Statement</a>
    </div>

    <ul class="hero__pillars">
      @for (pillar of pillars(); track pillar.title) {
        <li>
          <span class="hero__pillar-icon">
            <app-icon [name]="iconOf(pillar.icon)" [size]="18" />
          </span>
          <strong>{{ pillar.title }}</strong>
        </li>
      }
    </ul>
  </div>
</section>
