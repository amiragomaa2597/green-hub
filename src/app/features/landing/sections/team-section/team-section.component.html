<section id="team" class="section section--alt">
  <div class="container">
    <app-section-header
      [eyebrow]="content().eyebrow"
      [title]="content().title"
      [hook]="hook()"
      [lead]="ui().teamLead"
    />

    <app-section-media
      [src]="visual().src"
      [alt]="visual().alt"
      [caption]="visual().caption"
    />

    <article class="advisor panel" appRevealOnScroll>
      <span class="icon-bubble"><app-icon name="grad" [size]="24" /></span>
      <div>
        <p class="eyebrow">{{ ui().instructorAdvisor }}</p>
        <h3>{{ content().advisor.name }}</h3>
        <p>{{ content().advisor.role }}</p>
      </div>
    </article>

    <app-obs-chart
      [badge]="ui().obsBadge"
      [title]="ui().obsTitle"
      [note]="content().obsNote"
      [pmRole]="ui().projectManager"
      [pmName]="content().pmName"
      [equalLabel]="ui().obsEqualLevel"
      [peers]="content().obsPeers"
    />
  </div>
</section>
