<section id="thank-you" class="thank-you">
  <div
    class="thank-you__media"
    [style.background-image]="'url(' + meta().secondaryImage + ')'"
    aria-hidden="true"
  ></div>
  <div class="thank-you__veil" aria-hidden="true"></div>

  <div class="container thank-you__content">
    <img class="thank-you__logo" [src]="meta().logo" [alt]="meta().brand + ' logo'" />
    <h2>{{ meta().thankYouTitle }}</h2>
    <p class="thank-you__tagline">{{ meta().thankYouTagline }}</p>
    <p class="thank-you__credit">{{ meta().thankYouCredit }}</p>
    <ul>
      @for (name of names(); track name) {
        <li>{{ name }}</li>
      }
    </ul>
  </div>
</section>
