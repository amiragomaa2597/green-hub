<section id="impact" class="section">
  <div class="container">
    <app-section-header
      [eyebrow]="content().eyebrow"
      [title]="content().title"
      [hook]="hook()"
      [lead]="content().intro"
    />

    <app-section-media
      [src]="visual().src"
      [alt]="visual().alt"
      [caption]="visual().caption"
    />

    <app-impact-orbit
      [label]="ui().sustainableImpact"
      [highlight]="content().highlight"
      [areas]="content().areas"
    />
  </div>
</section>
